<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>koa-simple</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at top right, rgba(38, 99, 235, 0.18), transparent 34%),
          linear-gradient(135deg, #f3f7ff 0%, #eefaf5 52%, #fff7ec 100%);
        color: #1f2937;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(920px, calc(100% - 32px));
        padding: 36px;
        border-radius: 28px;
        border: 1px solid rgba(31, 41, 55, 0.08);
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 24px 72px rgba(31, 41, 55, 0.12);
        backdrop-filter: blur(16px);
      }

      .eyebrow {
        display: inline-flex;
        padding: 6px 12px;
        border-radius: 999px;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(30px, 4vw, 52px);
        line-height: 1.08;
      }

      p {
        margin: 0;
        max-width: 620px;
        line-height: 1.8;
        color: #4b5563;
      }

      ul {
        margin: 24px 0 0;
        padding-left: 20px;
        color: #374151;
        line-height: 1.8;
      }

      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.08);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">koa-simple</span>
      <h1>一个开箱可跑的 Koa 服务端模板</h1>
      <p>
        模板默认集成了健康检查、示例接口、静态资源服务和统一错误处理，适合快速起一个 API
        服务或后台项目。
      </p>
      <ul>
        <li><code>GET /api/system/health</code>：查看服务健康状态</li>
        <li><code>GET /api/demo</code>：查看模板自带示例数据</li>
        <li><code>POST /api/demo/echo</code>：调试请求体解析是否正常</li>
      </ul>
    </main>
  </body>
</html>
